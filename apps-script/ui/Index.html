<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <base target="_top" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title><?= appName ?></title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <?!= include('ui/Styles') ?>
</head>
<body>
<div id="toast-host" class="toast-host"></div>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo"><span class="material-icons-outlined">school</span></div>
      <div>
        <div class="brand-name">Interactive Learning</div>
        <div class="brand-sub">FutureSkills · ILM</div>
      </div>
    </div>

    <nav class="nav" id="side-nav">
      <button data-view="courses" class="active">
        <span class="material-icons-outlined">grid_view</span> Courses
      </button>
      <button data-view="analytics">
        <span class="material-icons-outlined">insights</span> Analytics
      </button>
      <button data-view="notifications">
        <span class="material-icons-outlined">notifications</span> Notifications
      </button>
      <button data-view="settings">
        <span class="material-icons-outlined">settings</span> Settings
      </button>
    </nav>

    <div style="margin-top:auto; display:flex; flex-direction:column; gap:8px;">
      <button class="btn btn-ghost" onclick="ILM.toggleTheme()">
        <span class="material-icons-outlined">dark_mode</span> Toggle theme
      </button>
      <button class="btn btn-ghost" onclick="seed()">
        <span class="material-icons-outlined">auto_awesome</span> Seed demo data
      </button>
      <div class="card" style="padding:10px; display:flex; align-items:center; gap:10px;">
        <div class="avatar" id="user-avatar">L</div>
        <div style="min-width:0;">
          <div style="font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis;" id="user-name">Lecturer</div>
          <div style="font-size:11px; color:var(--fg-subtle); overflow:hidden; text-overflow:ellipsis;" id="user-email"></div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <div class="search">
        <span class="material-icons-outlined">search</span>
        <input id="global-search" placeholder="Search courses, activities…" />
      </div>
      <button class="icon-btn" title="Notifications">
        <span class="material-icons-outlined">notifications_none</span>
      </button>
      <button class="icon-btn" onclick="ILM.toggleTheme()" title="Theme">
        <span class="material-icons-outlined">dark_mode</span>
      </button>
    </div>

    <div id="view-root"><div class="skeleton" style="height:180px; margin-bottom:16px;"></div></div>
  </main>
</div>

<button class="fab" title="Create course" onclick="showCreateCourse()">
  <span class="material-icons-outlined">add</span>
</button>

<!-- Create Course Modal -->
<div class="modal-backdrop" id="modal-course">
  <div class="modal">
    <header>
      <h2>Create course</h2>
      <button class="icon-btn" onclick="ILM.closeModal('modal-course')"><span class="material-icons-outlined">close</span></button>
    </header>
    <div class="body">
      <div class="field"><label>Course name</label><input class="input" id="c-name" placeholder="Introduction to Data Science"/></div>
      <div class="row">
        <div class="field"><label>Code</label><input class="input" id="c-code" placeholder="DSC101"/></div>
        <div class="field"><label>Semester</label><input class="input" id="c-sem" placeholder="2026 · Semester 1"/></div>
      </div>
      <div class="field"><label>Description</label><textarea class="textarea" id="c-desc" placeholder="What will students learn?"></textarea></div>
    </div>
    <footer>
      <button class="btn" onclick="ILM.closeModal('modal-course')">Cancel</button>
      <button class="btn btn-primary" onclick="createCourse()"><span class="material-icons-outlined">add</span> Create course</button>
    </footer>
  </div>
</div>

<!-- Create Activity Modal -->
<div class="modal-backdrop" id="modal-activity">
  <div class="modal">
    <header>
      <h2>New activity</h2>
      <button class="icon-btn" onclick="ILM.closeModal('modal-activity')"><span class="material-icons-outlined">close</span></button>
    </header>
    <div class="body">
      <div class="row">
        <div class="field"><label>Type</label>
          <select id="a-type" onchange="onActivityTypeChange()">
            <option value="question">Question</option>
            <option value="checklist">Checklist</option>
          </select>
        </div>
        <div class="field"><label>Module #</label><input class="input" id="a-module" type="number" value="1" min="1"/></div>
      </div>
      <div class="field"><label>Session name</label><input class="input" id="a-session" placeholder="Session 3 — Pandas basics"/></div>
      <div class="field"><label>Title / Question</label><textarea class="textarea" id="a-title" placeholder="What did you learn today?"></textarea></div>
      <div class="field"><label>Body / instructions</label><textarea class="textarea" id="a-body" placeholder="Optional description, markdown supported."></textarea></div>
      <div class="row">
        <div class="field"><label>Difficulty</label>
          <select id="a-diff"><option>easy</option><option selected>medium</option><option>hard</option></select>
        </div>
        <div class="field"><label>Estimated minutes</label><input class="input" id="a-min" type="number" value="5" min="1"/></div>
      </div>
      <div class="field"><label>Tags (comma separated)</label><input class="input" id="a-tags" placeholder="reflection, week 3"/></div>

      <div id="a-checklist-wrap" style="display:none;">
        <label style="font-size:12px; font-weight:600; color:var(--fg-muted); text-transform:uppercase; letter-spacing:.06em;">
          Checklist items — drag to reorder
        </label>
        <div id="a-checklist" class="checklist-builder" style="margin-top:6px;"></div>
        <button class="btn btn-sm" style="margin-top:8px;" onclick="addChecklistRow()">
          <span class="material-icons-outlined">add</span> Add item
        </button>
      </div>

      <div class="row" style="margin-top:6px;">
        <label class="switch"><input type="checkbox" id="a-anon"> Anonymous responses</label>
        <label class="switch"><input type="checkbox" id="a-likes" checked> Likes & dislikes</label>
      </div>
      <div class="row">
        <label class="switch"><input type="checkbox" id="a-comments" checked> Comments</label>
        <label class="switch"><input type="checkbox" id="a-ai" checked> AI summary</label>
      </div>
    </div>
    <footer>
      <button class="btn" onclick="ILM.closeModal('modal-activity')">Cancel</button>
      <button class="btn btn-primary" onclick="createActivity()"><span class="material-icons-outlined">rocket_launch</span> Publish</button>
    </footer>
  </div>
</div>

<!-- Embed code modal -->
<div class="modal-backdrop" id="modal-embed">
  <div class="modal">
    <header>
      <h2>Embed code</h2>
      <button class="icon-btn" onclick="ILM.closeModal('modal-embed')"><span class="material-icons-outlined">close</span></button>
    </header>
    <div class="body">
      <p>Paste this snippet into Canvas, Notion, Moodle, Blackboard, Google Sites or Microsoft Teams. The iframe auto-resizes.</p>
      <textarea class="textarea" id="embed-code" style="min-height:180px; font-family:var(--font-mono); font-size:12px;"></textarea>
    </div>
    <footer>
      <button class="btn btn-primary" onclick="copyEmbed()">
        <span class="material-icons-outlined">content_copy</span> Copy to clipboard
      </button>
    </footer>
  </div>
</div>

<?!= include('ui/Scripts') ?>
<?!= include('ui/Components') ?>

<script>
  ILM.initTheme();
  document.addEventListener('DOMContentLoaded', function () {
    App.init();
  });
</script>
</body>
</html>
